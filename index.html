
<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пирог со смыслом</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<div class="overlay">
<div class="emoji">🥧</div>
<h1>Пирог со смыслом</h1>
<p>Каждый пирог помогает создавать пространство для детей.</p>

<div class="stat" id="sold">0</div>
<div class="sub">Продано пирогов</div>

<div class="progress"><div id="fill"></div></div>
<div id="percent"></div>

<div class="grid">
<div class="card"><small>До цели </small><strong id="left"></strong></div>
<div class="card"><small>Собрано </small><strong id="money"></strong></div>
</div>

<a class="btn" href="#">Заказать пирог</a>
</div>
</header>

<section>
<h2>Как помочь</h2>
<div class="grid">
<div class="card">🥧 Купить пирог</div>
<div class="card">📢 Рассказать друзьям</div>
<div class="card">❤️ Следить за строительством</div>
</div>
</section>

<footer>Спасибо каждому, кто становится частью этой истории.</footer>
<script src="script.js"></script>
</body></html>
